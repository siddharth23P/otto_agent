[project]
name = "otto-cli-agent"
version = "0.0.1"
description = "Otto swarm agents"
requires-python = ">=3.12"
dependencies = [
    "emoji>=2.15.0",
    "fastembed>=0.8.0",
    "inceptionai>=0.1.3",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.0",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "numpy>=2.5.3",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "textual>=8.2.8",
    "tiktoken>=0.14.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
otto = "agent.cli.main:app"

# The project is named otto-cli-agent but the package directory is `agent`,
# so hatchling's name-matching heuristic finds nothing. Name it explicitly.
[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = ["pytest>=8.0"]

# A bare `pytest`/`uv run pytest -q` (what CI runs) otherwise walks the whole
# repo, including _to_delete/ (retired files kept around because device_bash
# can't rm without an extra permission grant -- see its own module notes)
# and langfuse/ (a large cloned reference repo, gitignored but still on
# disk locally). Both can contain stale or unrelated test-shaped files that
# break collection for reasons that have nothing to do with this project's
# own tests. Pinning collection to tests/ is what every CI run and every
# local `uv run pytest -q` actually means to do anyway.
[tool.pytest.ini_options]
testpaths = ["tests"]
