[project]
name = "otto-cli-agent"
version = "0.1.3"
description = "Otto: a terminal AI agent built around measured results -- one agent loop, a rubric-first evaluator, tiered memory, multi-vendor routing, and six benchmark harnesses."
readme = "docs/pypi.md"
license = { file = "LICENSE" }
authors = [{ name = "Siddharth Priyadarshi", email = "sid23p@gmail.com" }]
requires-python = ">=3.12"
keywords = ["llm", "agent", "tui", "langgraph", "evaluation", "swe-bench", "claw-eval", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = [
    "emoji>=2.15.0",
    "inceptionai>=0.1.3",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.0",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    # 1.26.2 because that is the newest numpy Android has: PyPI publishes no Android wheel for any
    # version, and numpy's own Android support landed after 2.5.3 shipped (upstream f67f65a1,
    # 2026-07-16), so 2.5.3 cannot be cross-built -- its meson runs test binaries to find the long
    # double format, and bionic has no long double complex maths (2026-09-16, six CI attempts).
    # Nothing here needs a newer numpy: this package uses ndarray, linalg, float32, asarray, where,
    # stack, argsort, frombuffer and dot, all of them long-settled API.
    "numpy>=1.26.2",
    # Documents otto makes (agent/pipeline/documents.py, the make_document
    # tool, research exports), in-process and so on a phone too: all four are
    # pure Python, and their compiled needs (lxml, Pillow) have Android builds.
    "openpyxl>=3.1.5",
    "prompt-toolkit>=3.0.53",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "reportlab>=4.2",
    "textual>=8.2.8",
    "tiktoken>=0.14.0",
    "typer>=0.27.2",
]

# fastembed pulls onnxruntime, which has no Android wheel; the memory engine
# degrades to hosted embeddings (a Gemini key) or unranked recall without it
# (agent/memory/embeddings.py). langgraph-cli is the local LangGraph dev
# server, never imported by the package. websockets serves `otto serve`.
[project.optional-dependencies]
local-embeddings = ["fastembed>=0.8.0"]
serve = ["websockets>=13"]
dev-server = ["langgraph-cli[inmem]>=0.4.31"]

[project.urls]
Repository = "https://github.com/siddharth23P/otto_agent"
Issues = "https://github.com/siddharth23P/otto_agent/issues"

[project.scripts]
otto = "agent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The project is named otto-cli-agent but the package directory is `agent`,
# so hatchling's name-matching heuristic finds nothing. Name it explicitly.
[tool.hatch.build.targets.wheel]
packages = ["agent"]

# The dev group carries every extra, so `uv sync` and CI test the whole
# surface, local embeddings included.
[dependency-groups]
dev = ["pytest>=8.0", "fastembed>=0.8.0", "websockets>=13", "langgraph-cli[inmem]>=0.4.31"]

# Pin collection to tests/ so a bare `pytest` (what CI runs) never walks
# anything else that happens to be on disk -- a cloned reference repo, a
# scratch directory -- and breaks collection for reasons unrelated to this
# project's own tests.
[tool.pytest.ini_options]
testpaths = ["tests"]
