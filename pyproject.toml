[project]
name = "otto-cli-agent"
version = "0.1.1"
description = "Otto: a terminal AI agent built around measured results -- one agent loop, a rubric-first evaluator, tiered memory, multi-vendor routing, and six benchmark harnesses."
readme = "docs/pypi.md"
license = { file = "LICENSE" }
authors = [{ name = "Siddharth Priyadarshi", email = "sid23p@gmail.com" }]
requires-python = ">=3.12"
keywords = ["llm", "agent", "tui", "langgraph", "evaluation", "swe-bench", "claw-eval", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = [
    "emoji>=2.15.0",
    "fastembed>=0.8.0",
    "inceptionai>=0.1.3",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.0",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "prompt-toolkit>=3.0.53",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.3",
    "reportlab>=4.2",
    "textual>=8.2.8",
    "tiktoken>=0.14.0",
    "typer>=0.27.2",
]

[project.urls]
Repository = "https://github.com/siddharth23P/otto_agent"
Issues = "https://github.com/siddharth23P/otto_agent/issues"

[project.scripts]
otto = "agent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The project is named otto-cli-agent but the package directory is `agent`,
# so hatchling's name-matching heuristic finds nothing. Name it explicitly.
[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = ["pytest>=8.0"]

# Pin collection to tests/ so a bare `pytest` (what CI runs) never walks
# anything else that happens to be on disk -- a cloned reference repo, a
# scratch directory -- and breaks collection for reasons unrelated to this
# project's own tests.
[tool.pytest.ini_options]
testpaths = ["tests"]
